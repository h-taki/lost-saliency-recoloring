seed_everything: 42
trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: 32
  log_every_n_steps: 10
  default_root_dir: runs/msi_p_hf_method3_h14c
  deterministic: false
model:
  class_path: sm_cvd.lightning_modules.MSINetLightning
  init_args:
    learning_rate: 1.0e-5
    loss_variant: method3
    pretrained_vgg16: false
    pretrained_path: weights/msinet_p_salicon_pseudo_v4.pth
data:
  class_path: sm_cvd.data.EToCVDDataModule
  init_args:
    dataset_root: /PATH/TO/EToCVD/P
    splits_folder: sim_splits_30_fricromask
    fold: 1
    image_size: [240, 320]
    batch_size: 1
    num_workers: 2
    offline_variants: ["original"]
    augment:
      class_path: sm_cvd.data.AugmentConfig
      init_args:
        use_hf: true
        use_rrc: false
        use_re: false
        prob_each: 0.5
