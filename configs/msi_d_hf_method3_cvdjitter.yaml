# H-4 (A2): CVD-specific augmentation (hue / saturation jitter)
#
#   - augment.use_color_jitter: true
#   - default_root_dir: runs/msi_d_hf_method3_cvdjitter
#
#
#   python scripts/run_kfold.py --config configs/msi_d_hf_method3_cvdjitter.yaml --num-folds 20
#

seed_everything: 42

trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: 32
  log_every_n_steps: 10
  default_root_dir: runs/msi_d_hf_method3_cvdjitter
  deterministic: false

model:
  class_path: sm_cvd.lightning_modules.MSINetLightning
  init_args:
    learning_rate: 1.0e-5
    loss_variant: method3
    pretrained_vgg16: false
    pretrained_path: weights/msinet_salicon_pytorch.pth

data:
  class_path: sm_cvd.data.EToCVDDataModule
  init_args:
    dataset_root: /PATH/TO/EToCVD/D
    splits_folder: splits_30_original
    fold: 1
    image_size: [240, 320]
    batch_size: 1
    num_workers: 2
    augment:
      class_path: sm_cvd.data.AugmentConfig
      init_args:
        use_hf: true
        use_rrc: false
        use_re: false
        use_color_jitter: true                # ← H-4 NEW
        cj_brightness: 0.1
        cj_contrast: 0.0
        cj_saturation: 0.2
        cj_hue: 0.08
        prob_each: 0.5
