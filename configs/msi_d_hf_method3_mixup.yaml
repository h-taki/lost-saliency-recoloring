# H-3 (A1): MixUp augmentation on (image, saliency_map)
#
#   - default_root_dir: runs/msi_d_hf_method3_mixup
#
#
#   python scripts/run_kfold.py --config configs/msi_d_hf_method3_mixup.yaml --num-folds 20
#

seed_everything: 42

trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: 32
  log_every_n_steps: 10
  default_root_dir: runs/msi_d_hf_method3_mixup
  deterministic: false

model:
  class_path: sm_cvd.lightning_modules.MSINetLightning
  init_args:
    learning_rate: 1.0e-5
    loss_variant: method3
    pretrained_vgg16: false
    pretrained_path: weights/msinet_salicon_pytorch.pth
    mixup_alpha: 0.4                       # ← H-3 NEW

data:
  class_path: sm_cvd.data.EToCVDDataModule
  init_args:
    dataset_root: /PATH/TO/EToCVD/D
    splits_folder: splits_30_original
    fold: 1
    image_size: [240, 320]
    batch_size: 4
    num_workers: 2
    augment:
      class_path: sm_cvd.data.AugmentConfig
      init_args:
        use_hf: true
        use_rrc: false
        use_re: false
        prob_each: 0.5
